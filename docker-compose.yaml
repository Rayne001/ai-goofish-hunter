services:
  app:
    image: ai-goofish-hunter:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-goofish-hunter-app
    init: true
    ports:
      - "127.0.0.1:18000:8000"
    env_file:
      - .env
    environment:
      APP_DATABASE_FILE: /app/data/app.sqlite3
    volumes:
      - ./.env:/app/.env
      - ./data:/app/data
      - ./state:/app/state
      - ./config.json:/app/config.json
      - ./prompts:/app/prompts
      - ./jsonl:/app/jsonl
      - ./logs:/app/logs
      - ./images:/app/images
      - ./price_history:/app/price_history
    restart: unless-stopped
